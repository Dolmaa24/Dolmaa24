name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Renders the contribution grid as an animated SVG, in the amber palette
      # the rest of the profile uses.
      - name: generate snake.svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23e3b341&color_dots=%23161b22,%233a2f14,%23806b26,%23c19b31,%23e3b341

      # Publishes to a dedicated `output` branch so generated art never lands
      # in main's history. README.md reads the image from that branch.
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
