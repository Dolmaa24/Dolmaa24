<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="I document what a thing does not do, next to what it does.">
  <defs>
    <linearGradient id="ffade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0"    stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.10" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="0.90" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="1"    stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="130" fill="#0d1117"/>
  <rect x="0" y="0.5" width="1000" height="1" fill="url(#ffade)"/>

  <text class="mono" x="500" y="60" font-size="15" letter-spacing="0.6" text-anchor="middle" fill="#8b949e">I document what a thing doesn&#39;t do, next to what it does.</text>

  <rect x="466" y="86" width="6" height="6" transform="rotate(45 469 89)" fill="#30363d"/>
  <rect x="497" y="86" width="6" height="6" transform="rotate(45 500 89)" fill="#e3b341"/>
  <rect x="528" y="86" width="6" height="6" transform="rotate(45 531 89)" fill="#30363d"/>
</svg>
